<section class="index-gallery">
    <h1 class="index-signature">{{ page.homeSignature | default: "SZILVIA VARGA" }}</h1>
    <div class="index-gallery_grid">
        {% assign index_sources = site.projects %}
        {% for project in index_sources %}
            {% if project.indexImage %}
                {% for image in project.indexImage %}
                    <figure class="index-gallery_item">
                        {% if project.title %}
                        <a href="{{ project.permalink}}">
                            {% assign image_lower = image | downcase %}
                            {% if image_lower contains '.mp4' or image_lower contains '.webm' or image_lower contains '.mov' %}
                                <video
                                    src="{{ image | relative_url }}"
                                    aria-label="{{ project.title }}"
                                    autoplay
                                    muted
                                    loop
                                    playsinline
                                    preload="metadata"
                                    tooltip="{{ project.title }}"
                                ></video>
                            {% else %}
                                <img src="{{ image | relative_url }}" alt="{{ project.title }}" loading="lazy" decoding="async" tooltip="{{ project.title }}">
                            {% endif %}
                        </a>
                        {% endif %}
                    </figure>
                {% endfor %}
            {% endif %}
        {% endfor %}

    </div>
</section>
