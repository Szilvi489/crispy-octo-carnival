<section class="bangkok-night-section">
    {%- assign layout_data = empty -%}
    {%- if page.layout_data_key and page.layout_data_key != blank -%}
        {%- assign layout_data = site.data[page.layout_data_key] | default: empty -%}
    {%- endif -%}
    <div class="bangkok-night-content">
        <p class="bangkok-night-helper">Scroll through the stage. Click photos and videos to open them.</p>
        <div class="bangkok-night-track" aria-label="{{ page.title }} gallery">
            <div class="bangkok-night-layer" data-layer="1"></div>
            <div class="bangkok-night-layer" data-layer="2"></div>
            <div class="bangkok-night-layer" data-layer="3"></div>
            <div class="bangkok-night-layer" data-layer="4"></div>
        </div>
        <div class="bangkok-night-overlay" hidden aria-hidden="true">
            <div class="bangkok-night-overlay__backdrop" data-close-overlay></div>
            <div class="bangkok-night-overlay__panel" role="dialog" aria-modal="true" aria-label="{{ page.title }} overlay">
                <button class="bangkok-night-overlay__close" type="button" aria-label="Close overlay" data-close-overlay>
                    <span aria-hidden="true">x</span>
                </button>
                <div class="bangkok-night-overlay__content"></div>
            </div>
        </div>
        <script id="bn-gallery-data" type="application/json">
        {
          "title": {{ page.title | default: site.title | jsonify }},
          "stage": {{ layout_data.stage | default: empty | jsonify }},
          "items": {{ layout_data.items | default: empty | jsonify }},
          "motions": {{ layout_data.motions | default: empty | jsonify }}
        }
        </script>
    </div>
</section>
