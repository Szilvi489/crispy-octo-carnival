<div class="landing-intro">
    <div class="landing-intro-background">
        <div class="landing-intro-content">
            {%- assign gallery_path = "assets/images/projects/cambodiaStreet/landing_intro" -%}
            {%- assign gallery_files = site.static_files | where_exp: "f", "f.path contains gallery_path" -%}
            {%- assign gallery_list = gallery_files | map: "path" | sort -%}
            <div class="landing-intro-counter" aria-hidden="true">0%</div>
            <img src="" alt="" data-location="">
        </div>

          <script id="cambodia-street-gallery-thumbnail-data" type="application/json">
        {
          "all": {{ gallery_list | jsonify }}
        }
        </script>
    </div>
</div>
