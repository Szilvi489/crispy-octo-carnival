<article class="slide-show-article-panel" aria-live="polite">
  <button class="slide-show-article-close" type="button" style="--navFontColour: {{ page.navFontColour | default: site.navFontColour }};" aria-label="Close article">
    <i class="fa-solid fa-arrow-left-long" aria-hidden="true"></i>
  </button>
  <h2 class="slide-show-article-intro-title" aria-hidden="true">
    <span class="slide-show-article-intro-main"></span>
    <span class="slide-show-article-intro-sub"></span>
  </h2>
  <div class="slide-show-article-content">
    <div class="slide-show-article-content-box1">
      <h3 class="slide-show-article-title"></h3>
      <p class="slide-show-article-text"></p>
      <div class="slide-show-article-extra-images"></div>
    </div>
    <div class="slide-show-article-content-box2">
      <div class="slide-show-article-container slide-show-article-container-a"></div>
      <div class="slide-show-article-container slide-show-article-container-b">
        <div class="slide-show-article-meta-grid">
          <div class="slide-show-article-meta-item slide-show-article-meta-time">
            <div class="slide-show-article-meta-label">Local Time</div>
            <div class="slide-show-article-meta-value" data-meta="time">--:--:--</div>
          </div>
          <div class="slide-show-article-meta-item">
            <div class="slide-show-article-meta-label">Weather</div>
            <div class="slide-show-article-meta-value" data-meta="field2">Add coordinates</div>
          </div>
          <div class="slide-show-article-meta-item">
            <div class="slide-show-article-meta-flag" data-meta="field3"></div>
          </div>
          <div class="slide-show-article-meta-item">
            <div class="slide-show-article-meta-label">Country</div>
            <div class="slide-show-article-meta-value" data-meta="field4">Add country code</div>
          </div>
        </div>
      </div>
      <div class="slide-show-article-container slide-show-article-container-c"></div>
    </div>
  </div>
</article>
