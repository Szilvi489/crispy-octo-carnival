<section class="contact-page-section" style="--backgroundColour: {{ page.backgroundColour | default: site.backgroundColour }};">
<p class="title titleP1 ">Contact</p>
<p class="title titleP2 ">Me</p>

<form class="contact-form" method="post" action="/contactPage/send.php" novalidate>
  <div class="row">
      <h2 class="contact-text contactTextPart1">Hi Szilvi, My name is</h2>
      <input type="text" name="name" placeholder="Your Name" class="contact-input contact-input-name" autocomplete="name" maxlength="120" required>
      <h2 class="contact-text contactTextComma">,</h2>
  </div>

  <div class="row">
    <h2 class="contact-text contactTextPart2">I am reaching out, because</h2>
    <select id="contactReason" name="reason" class="contact-input contact-input-reason" required>
      <option value="" selected disabled>Please choose</option>
      <option value="job">Job opportunity</option>
      <option value="freelance-project">Freelance Project</option>
      <option value="collab">Collaboration</option>
      <option value="question">Question</option>
      <option value="other">Other</option>
    </select>
  </div>

  <div class="row">
      <h2 class="contact-text contactTextPart3">About</h2>
      <input type="text" name="about" placeholder="Company or Project name" class="contact-input contact-input-about" autocomplete="organization" maxlength="180">
  </div>

  <div class="column">
    <h2 class="contact-text contactTextPart4">My message:</h2>
    <textarea name="message" class="contact-input contact-input-message" placeholder="Type your message here..." spellcheck="false" autocorrect="off" autocapitalize="off" maxlength="5000" required></textarea>
  </div>

  <div class="row">
    <h2 class="contact-text contactTextPart5">You can reach me at</h2>
    <input type="email" name="email" placeholder="Your Email" class="contact-input contact-input-email" autocomplete="email" maxlength="160" required>
  </div>

  <div class="contact-honeypot" aria-hidden="true">
    <label for="contactWebsite">Leave this field empty</label>
    <input id="contactWebsite" type="text" name="website" tabindex="-1" autocomplete="off">
  </div>

  <div class="row contact-submit-row">
    <p class="contact-form-status" aria-live="polite"></p>
    <button type="submit" class="contact-submit-button">Send Message</button>
  </div>

</form>



  <div class="contact-circle-stage" aria-hidden="true">
    <div class="contact-gradient-circle"></div>
  </div>
</section>
