<section id="cv-skills" class="cv-skills-section">
    {%- assign skill_scores = site.data.skillsScores.skills -%}
    <h2 class="cv-skills-title">{{ cv_i18n.skills.title }}</h2>
    <div class="cv-skills-grid" aria-label="{{ cv_i18n.skills.grid_aria_label }}"></div>
    <aside class="cv-skills-hover-card" aria-live="polite" hidden></aside>
    <script
        id="cv-skills-data"
        type="application/json"
        data-knowledge-label="{{ cv_i18n.skills.hover.knowledge_label | escape }}"
        data-note-fallback="{{ cv_i18n.skills.hover.note_fallback | escape }}"
        data-aria-label-suffix="{{ cv_i18n.skills.hover.aria_label_suffix | escape }}"
    >[
        {%- for skill_item in cv_i18n.skills.items -%}
        {
            "name": {{ skill_item.name | jsonify }},
            "score": {{ skill_scores[skill_item.name] | default: 50 | jsonify }},
            "logo": {{ skill_item.logo | default: "" | jsonify }},
            "note": {{ skill_item.note | default: "" | jsonify }}
        }{%- unless forloop.last -%},{%- endunless -%}
        {%- endfor -%}
    ]</script>
</section>
