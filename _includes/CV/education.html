<section id="cv-education" class="cv-education-section">
    {%- assign schools = cv_i18n.education.schools -%}
    <div class="cv-education-panels">
        <div class="cv-education-panel cv-education-panel-intro">
            <h2 class="cv-education-title">{{ cv_i18n.education.title }}</h2>
        </div>
        <div class="cv-education-panel cv-education-panel-content">
            <div class="cv-education-content">
                <div class="cv-education-sky-deco cv-education-sky-deco-1" aria-hidden="true">
                    <img class="cv-education-sky-image" src="/CV/assets/images/CV/chunkyImagesWithoutBackground/3dflower.png" alt="">
                </div>
                <div class="cv-education-sky-deco cv-education-sky-deco-2" aria-hidden="true">
                    <img class="cv-education-sky-image" src="/CV/assets/images/CV/chunkyImagesWithoutBackground/3dgreendisc.png" alt="">
                </div>
                <div class="cv-education-sky-deco cv-education-sky-deco-3" aria-hidden="true">
                    <img class="cv-education-sky-image" src="/CV/assets/images/CV/chunkyImagesWithoutBackground/3dwave.png" alt="">
                </div>
                <div class="cv-education-sky-deco cv-education-sky-deco-4" aria-hidden="true">
                    <img class="cv-education-sky-image" src="/CV/assets/images/CV/chunkyImagesWithoutBackground/3dflowerblue.png" alt="">
                </div>
                <span
                    class="cv-school-click-hint cv-education-click-hint"
                    data-hint-closed="{{ cv_i18n.education.click_hint_closed }}"
                    data-hint-open="{{ cv_i18n.education.click_hint_open }}"
                >{{ cv_i18n.education.click_hint }}</span>
                <article class="cv-school-item">
                    <div id="cv-school-info-1" class="cv-school-info">
                        <div class="cv-school-info-content">{{ schools[0].info }}</div>
                    </div>
                    <img class="cv-school-image" src="/CV/assets/images/CV/mySchoolsRemovedBackgrounds/School1.png" alt="">
                </article>
                <article class="cv-school-item">
                    <div id="cv-school-info-2" class="cv-school-info">
                        <div class="cv-school-info-content">{{ schools[1].info }}</div>
                    </div>
                    <img class="cv-school-image" src="/CV/assets/images/CV/mySchoolsRemovedBackgrounds/School2.png" alt="">
                </article>
                <article class="cv-school-item">
                    <div id="cv-school-info-3" class="cv-school-info">
                        <div class="cv-school-info-content">{{ schools[2].info }}</div>
                    </div>
                    <img class="cv-school-image" src="/CV/assets/images/CV/mySchoolsRemovedBackgrounds/School3.png" alt="">
                </article>
                <article class="cv-school-item">
                    <div id="cv-school-info-4" class="cv-school-info">
                        <div class="cv-school-info-content">{{ schools[3].info }}</div>
                    </div>
                    <img class="cv-school-image" src="/CV/assets/images/CV/mySchoolsRemovedBackgrounds/School4.png" alt="">
                </article>
            </div>
        </div>
    </div>
</section>
