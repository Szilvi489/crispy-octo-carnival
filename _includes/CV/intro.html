<section id="cv-intro" class="cv-intro-section">
    {%- assign orbit_text = cv_i18n.intro.orbit_text -%}
    <div class="cv-intro-content">
        <div class="cv-intro-hero">
            <div class="cv-intro-orbit-stage">
                <img class="cv-intro-orbit-scene-background intro-enter-target" src="/CV/assets/images/CV/backgroundImages/261_vector_image.jpg" alt="">
                <div class="cv-intro-orbit-scene intro-enter-target" aria-hidden="true">
                    <div class="cv-intro-orbit-ring cv-intro-orbit-ring-a">
                        {%- for character in orbit_text -%}
                        <span style="--i: {{ forloop.index }};">{{ character }}</span>
                        {%- endfor -%}
                    </div>
                    <img class="cv-intro-subject" src="/CV/assets/images/CV/removedBackgroundImages/fullBodyMe.png" alt="{{ cv_i18n.intro.portrait_alt }}">
                </div>
            </div>
        </div>
    </div>
    <div class="cv-intro-dust-background" aria-hidden="true">
        <img class="cv-intro-dust-image" src="/CV/assets/images/CV/backgroundImages/dustparticles.png" alt="">
    </div>
    <div class="cv-intro-title-wrapper intro-enter-target">
    <p class="cv-intro-text">{{ cv_i18n.intro.title }}</p>
    </div>
    <p class="cv-intro-scroll-hint intro-enter-target">{{ cv_i18n.intro.scroll_hint }}</p>
</section>
