# Decap CMS config for this Jekyll site.
# Official install pattern:
# https://decapcms.org/docs/install-decap-cms/
#
# Local learning mode:
# - Decap's local backend docs recommend `local_backend: true`
# - Start the proxy with `npm run cms:proxy`
# - Start the Jekyll server with `npm run serve:site`
# - Open http://127.0.0.1:4000/admin/
#
# Production note:
# This repo currently deploys to alwaysdata, not Netlify.
# The easiest production auth path is to connect the repo to Netlify Identity
# and Git Gateway, then keep this same config. Local mode already works without that.

backend:
  name: git-gateway
  branch: main

local_backend: true

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

display_url: "/"
show_preview_links: false

editor:
  preview: false

collections:
  - name: "photo_projects"
    label: "Photo Projects"
    label_singular: "Photo Project"
    description: "Project front matter from the Jekyll `_projects` collection. The project shell is scaffolded from the entry slug."
    folder: "_projects"
    create: true
    delete: false
    extension: "markdown"
    format: "frontmatter"
    path: "{{slug}}/{{slug}}"
    slug: "{{slug}}"
    summary: "{{title}} -> {{permalink}}"
    fields:
      - label: "Title"
        name: "title"
        widget: "string"
      - label: "Description"
        name: "description"
        widget: "text"
      - label: "Permalink"
        name: "permalink"
        widget: "string"
        hint: "Example: /projects/new-project/"
      - label: "Hero Image"
        name: "hero_image"
        widget: "image"
        required: false
      - label: "Gallery Folder Path"
        name: "gallery_path"
        widget: "string"
        required: false
        hint: "Optional fallback folder for layouts that scan images from a directory."
      - label: "Gallery Images"
        name: "gallery_images"
        widget: "list"
        required: false
        hint: "Optional CMS-managed gallery list. When filled, this overrides folder scanning."
        field:
          label: "Gallery Image"
          name: "image"
          widget: "image"
      - label: "Layout Data Key"
        name: "layout_data_key"
        widget: "string"
        required: false
        hint: "Optional `_data` key for layout-specific structured data, for example `bangkokNightLayout`."
      - label: "3D Model Path"
        name: "model_path"
        widget: "string"
        required: false
        hint: "Optional model asset path for layouts like Cambodia Street."
      - label: "Navigation Square Color"
        name: "navSquareColour"
        widget: "string"
        required: false
      - label: "Navigation Font Color"
        name: "navFontColour"
        widget: "string"
        required: false
      - label: "Stylesheets"
        name: "stylesheets"
        widget: "list"
        required: false
        field:
          label: "Stylesheet Path"
          name: "stylesheet"
          widget: "string"
      - label: "Fonts"
        name: "fonts"
        widget: "list"
        required: false
        field:
          label: "Font URL"
          name: "font"
          widget: "string"
      - label: "Scripts"
        name: "scripts"
        widget: "list"
        required: false
        field:
          label: "Script Path"
          name: "script"
          widget: "string"
      - label: "Thumbnail Paths"
        name: "thumbnails"
        widget: "list"
        required: false
        field:
          label: "Thumbnail Path"
          name: "thumbnail"
          widget: "string"
      - label: "Homepage Index Images"
        name: "indexImage"
        widget: "list"
        required: false
        field:
          label: "Image"
          name: "image"
          widget: "image"
      - label: "Small Images"
        name: "smallImages"
        widget: "list"
        required: false
        field:
          label: "Image"
          name: "image"
          widget: "image"
      - label: "Medium Images"
        name: "mediumImages"
        widget: "list"
        required: false
        field:
          label: "Image"
          name: "image"
          widget: "image"
      - label: "Large Images"
        name: "largeImages"
        widget: "list"
        required: false
        field:
          label: "Image"
          name: "image"
          widget: "image"
      - label: "Layout"
        name: "layout"
        widget: "hidden"
        required: false

  - name: "cv_files"
    label: "CV Files"
    description: "Single-file content sources that already fit Decap well."
    files:
      - label: "Downloadable CV Markdown"
        name: "downloadable_cv"
        file: "CV/download/cv-download.md"
        fields:
          - label: "Title"
            name: "title"
            widget: "string"
          - label: "Body"
            name: "body"
            widget: "markdown"
