# base.x/base.y place the image inside the personal section in percent.
# base.width is in vw.
# motion.start/motion.end are section scroll progress values from 0 to 1.
# motion.from.x/to.x are viewport-width offsets in percent of the viewport width.
# motion.from.y/to.y are viewport-height offsets in percent of the viewport height.
