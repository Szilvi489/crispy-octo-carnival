# Bangkok Night choreography manifest
# - `start` and `end` are positions on the authored timeline.
# - `stage.timeline_length` sets the total available timeline space.
#   Example: if `timeline_length: 3`, you can place beats between 0 and 3.
# - `initial`, `from`, and `to` can use:
#   x, y, z, scale, autoAlpha, rotate, rotationX, rotationY, rotationZ, transformOrigin
# - for DOM items you can also use:
#   origin/pivot: center | left | right | top | bottom | top-left | top-right | bottom-left | bottom-right
# - shorthand edge rotations for DOM items:
#   rotateM = rotate around center
#   rotateL = rotate around left edge
#   rotateR = rotate around right edge
#   rotateT = rotate around top edge
#   rotateB = rotate around bottom edge
# - `target: model` animates the inside GLB object itself.
#   Rotation values are still written in degrees. `scale` is a multiplier.
# - any item can also use optional `idle_motion` for subtle autonomous motion
#   after a chosen authored beat (`start_at`). Values are amplitudes:
#   x, y, z, rotationX, rotationY, rotationZ, scale, plus `speed` and `phase`.
# - `type: shape` creates a plain positioned block with `width`, `height`,
#   `background` or `color`, plus optional `border_radius`, `border`,
#   `box_shadow`, and `backdrop_filter`.
# - `stage.background_shifts` lets the page background color drift over scroll.
#   Add timeline beats with `at` and either `background` or `color`.
#   Colors and gradients crossfade smoothly between beats.
# - `stage.design_width` / `stage.design_height` define the authored scene size.
#   The full Bangkok Night track scales down proportionally on smaller screens.
# - `stage.sunset_disc` adds a decorative half-sun behind the opening beats.
#   Tune it with `start`, `end`, `x`, `y`, `sink_y`, `size`, `background`,
#   `shadow`, and `opacity`.
# - `stage.scene_layers` adds full-screen "universe" layers above the scene.
#   Each layer can use `src` or `background`, plus `initial` and `steps`
#   using the same motion syntax as items.
# - `stage.tile_overlay` adds a full-stage square grid that can cover or uncover
#   the visible scene. Use `tile_size` and either a single timed step or
#   a `steps` array with `start`, `end`, `mode`, `order`, `background`/`color`,
#   and `opacity`. It can also source one full-screen image via `scene_layer`
#   or `src` so the squares form an actual picture instead of a flat fill.

stage:
  scroll_length: 18000
  timeline_length: 3
  design_width: 1680
  design_height: 900
  perspective: 2400
  perspective_origin: "50% 52%"
  sunset_disc:
    start: 0
    end: 0.24
    x: 90
    y: 150
    sink_y: 1040
    size: 1500
    opacity: 1
    background: "linear-gradient(180deg, #ffca28 0%, #f0660a 56%, #b31244 100%)"
    shadow: "0 -18px 140px rgba(255, 116, 22, 0.38)"
  scene_layers:
  - id: U2A
    src: "/assets/images/projects/bangkokNight/gallery_images/DSCF0829.jpg"
    size: "cover"
    position: "center center"
    initial:
      autoAlpha: 0
      scale: 1.04

  tile_overlay:
    tile_size: 96
    scene_layer: "U2A"
    steps:
    - start: 0.60
      end: 0.70
      mode: "cover"
      order: "random"
      color: "#0e1b33"
      opacity: 1
    - start: 0.75
      end: 0.90
      mode: "uncover"
      order: "random"
      color: "#0e1b33"
      opacity: 1
  
  background_shifts:
  - at: 0
    background: "linear-gradient(180deg, #e0a106 0%, #d96b11 58%, #6e3d52 100%)"
  - at: 0.18
    background: "linear-gradient(180deg, #d96b11 0%, #a63a50 60%, #4c3f6b 100%)"
  - at: 0.36
    background: "linear-gradient(180deg, #a63a50 0%, #5b3567 58%, #2f4f7f 100%)"
  - at: 0.58
    background: "linear-gradient(180deg, #415b88 0%, #1f3358 62%, #0e1b33 100%)"
  - at: 1
    color: "#0e1b33"
  - at: 1.30
    color: "#030C1F"
  - at: 1.60
    color: "#01050D"

