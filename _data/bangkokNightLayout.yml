# Bangkok Night choreography manifest
# - `start` and `end` are positions on the authored timeline.
# - `stage.timeline_length` sets the total available timeline space.
#   Example: if `timeline_length: 3`, you can place beats between 0 and 3.
# - `initial`, `from`, and `to` can use:
#   x, y, z, scale, autoAlpha, rotate, rotationX, rotationY, rotationZ, transformOrigin
# - for DOM items you can also use:
#   origin/pivot: center | left | right | top | bottom | top-left | top-right | bottom-left | bottom-right
# - shorthand edge rotations for DOM items:
#   rotateM = rotate around center
#   rotateL = rotate around left edge
#   rotateR = rotate around right edge
#   rotateT = rotate around top edge
#   rotateB = rotate around bottom edge
# - `target: model` animates the inside GLB object itself.
#   Rotation values are still written in degrees. `scale` is a multiplier.
# - any item can also use optional `idle_motion` for subtle autonomous motion
#   after a chosen authored beat (`start_at`). Values are amplitudes:
#   x, y, z, rotationX, rotationY, rotationZ, scale, plus `speed` and `phase`.
# - `stage.background_shifts` lets the page background color drift over scroll.
#   Add timeline beats with `at` and either `background` or `color`.
#   Colors and gradients crossfade smoothly between beats.
# - `stage.design_width` / `stage.design_height` define the authored scene size.
#   The full Bangkok Night track scales down proportionally on smaller screens.

stage:
  scroll_length: 18000
  timeline_length: 3
  design_width: 1680
  design_height: 900
  perspective: 2400
  perspective_origin: "50% 52%"
  background_shifts:
    - at: 0
      background: "linear-gradient(180deg,rgba(238, 234, 7, 1) 18%, rgba(14, 27, 51, 1) 100%)"
    - at: 0.45
      background: "linear-gradient(357deg,rgba(42, 76, 120, 1) 0%, rgba(14, 27, 51, 1) 65%)"
    - at: 0.62
      color: "#17100c"
    - at: 0.78
      color: "#0b1618"
    - at: 1.02
      color: "#100a14"

