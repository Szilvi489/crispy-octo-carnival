  - id: BNT03
    type: text
    text: "To the Security Guard at My Condo Who Salutes Me Like I Am the King of England. At Ease, Soldier. It is just me.I appreciate the respect. Really, I do. But every time I walk out of the gate to buy a toasted sandwich at 7-Eleven, you slam your heels together, snap your hand to your forehead, and scream:«Sawatdee Krub BOSS!» It is 7:00 AM. I am wearing pyjamas and flip-flops. You are wearing a uniform that looks like you are commanding a naval fleet. You have gold braids, four medals of honor, combat boots, and a beret.Sir, you are guarding a parking lot in Thong Lor, not the border of a war zone.And the whistle. We need to talk about the whistle.When I drive my car out, you don’t just guide me. You perform a jazz symphony. Preeet! Preeet! PREEET!You jump into the middle of Sukhumvit Road. You stop a speeding ten-wheel truck with nothing but your bare hand and pure confidence. You risk your life just so I can merge my little Toyota into traffic.I admire the bravery, but I am terrified I am going to watch you die for my morning commute."
    tag: p
    text_start:
      length: 1
      class_name: "is-dropcap"
    layer: 1
    width: 600
    overlay: false
    class_name: "is-copy is-all-caps"

  - id: BNT02
    type: text
    text: "And then, the «Night Mode.» I come home at 2:00 AM, and the military discipline has vanished. You are in your booth, head tipped back, mouth open, sleeping so peacefully. The radio is playing soft country folk songs. I don’t even tap my key card because I don’t want to wake you up. You look like a sleeping angel in a tactical vest.But the best part is how you treat the delivery drivers.My GrabFood driver is just trying to bring me a pizza. Why do you treat him like an international spy? You inspect his ID card, you make him sign the logbook, you stare him down.Meanwhile, you wave me through without looking.Thank you for your service, General. I feel safe. Mostly because the sound of your whistle scares away the ghosts."
    tag: p
    layer: 1
    width: 600
    overlay: false
    class_name: "is-copy is-all-caps"
  
