  - id: BNT03
    type: text
    text: "To the Security Guard at My Condo Who Salutes Me Like I Am the King of England. At Ease, Soldier. It is just me. I appreciate the respect. Really, I do. But every time I walk out of the gate to buy a toasted sandwich at 7-Eleven, you slam your heels together, snap your hand to your forehead, and scream: «Sawatdee Krub BOSS!»"
