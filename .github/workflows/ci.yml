name: CI
run-name: Jekyll Build + HTML checks

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Build site
        run: bundle exec jekyll build

      - name: HTML and link checks
        run: >
          bundle exec htmlproofer ./_site
          --assume-extension
          --check-html
          --disable-external
